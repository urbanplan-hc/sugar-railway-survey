<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>糖廠鐵路遺跡現地調查表</title>
    <!-- 載入 piexif.js 函式庫來處理 EXIF 資料 -->
    <script src="https://cdn.jsdelivr.net/npm/piexifjs@1.0.6/piexif.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: auto; }
        input[type="text"], textarea, button { width: 100%; margin-bottom: 15px; padding: 10px; box-sizing: border-box; font-size: 16px; }
        button { background-color: #4CAF50; color: white; border: none; cursor: pointer; border-radius: 5px; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        
        /* 雙按鈕排版設定 */
        .btn-group { display: flex; gap: 10px; margin-bottom: 5px; }
        .btn-camera { background-color: #2196F3; flex: 1; }
        .btn-gallery { background-color: #FF9800; flex: 1; }
        
        #fileNameDisplay { font-size: 14px; color: #555; margin-top: 0; margin-bottom: 15px; }
        #status { color: red; font-weight: bold; margin-bottom: 5px;}
        
        /* 進度條樣式 */
        #progressContainer { display: none; margin-bottom: 15px; }
        progress { width: 100%; height: 22px; }
        #progressText { text-align: center; font-size: 14px; color: #333; margin-top: 5px; font-weight: bold; }
    </style>
</head>
<body>

    <h2>🛤️ 糖鐵遺跡現地調查</h2>
    
    <label>遺跡名稱：</label>
    <input type="text" id="name" placeholder="例如：蒜頭糖廠XX車站" required>

    <label>簡介與現況描述：</label>
    <textarea id="desc" rows="4" placeholder="描述現場狀況..." required></textarea>

    <label>現地照片：</label>
    <div class="btn-group">
        <!-- 點擊觸發隱藏的相機輸入框 -->
        <button type="button" class="btn-camera" onclick="document.getElementById('photoCamera').click()">📷 開啟相機</button>
        <!-- 點擊觸發隱藏的相簿輸入框 -->
        <button type="button" class="btn-gallery" onclick="document.getElementById('photoGallery').click()">🖼️ 選擇相簿</button>
    </div>
    <p id="fileNameDisplay">尚未選擇照片</p>

    <!-- 隱藏的 input，用來實際接收檔案 -->
    <input type="file" id="photoCamera" accept="image/jpeg, image/png" capture="environment" style="display: none;" onchange="handleFileSelect(this)">
    <input type="file" id="photoGallery" accept="image/jpeg, image/png" style="display: none;" onchange="handleFileSelect(this)">

    <label>GPS 座標：</label>
    <button type="button" id="gpsBtn" onclick="getLocation()">📍 獲取目前定位</button>
    <p id="coords">尚未獲取定位</p>
    <input type="hidden" id="lat">
    <input type="hidden" id="lng">

    <button type="button" id="submitBtn" onclick="submitForm()">上傳調查資料</button>
    
    <!-- 狀態與進度條區塊 -->
    <p id="status"></p>
    <div id="progressContainer">
        <progress id="progressBar" value="0" max="100"></progress>
        <div id="progressText">0%</div>
    </div>

    <script>
        // ⚠️ 請務必將下方網址換成你的 Google Apps Script 網頁應用程式網址 ⚠️
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwtPVOc4NqmBwXxfGoTNsoxETakGKob5w74T1mzCumI3qZBMx816aMRIFZpMcx1Myh8/exec";

        let selectedFile = null;

        // 處理照片選擇的顯示
        function handleFileSelect(input) {
            if (input.files.length > 0) {
                selectedFile = input.files[0];
                document.getElementById('fileNameDisplay').innerText = "✅ 已選擇：" + selectedFile.name;
                document.getElementById('fileNameDisplay').style.color = "green";
            }
        }

        // 獲取 GPS 定位
        function getLocation() {
            const coordsText = document.getElementById("coords");
            coordsText.innerText = "定位中，請稍候...";
            
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    document.getElementById("lat").value = position.coords.latitude;
                    document.getElementById("lng").value = position.coords.longitude;
                    coordsText.innerText = `緯度: ${position.coords.latitude}\n經度: ${position.coords.longitude}`;
                }, function(error) {
                    coordsText.innerText = "無法獲取定位，請確認手機是否開啟 GPS 權限。";
                });
            } else {
                coordsText.innerText = "您的瀏覽器不支援定位功能。";
            }
        }

        // 處理資料上傳 (包含 EXIF 保留與照片壓縮)
        async function submitForm() {
            const name = document.getElementById("name").value;
            const desc = document.getElementById("desc").value;
            const lat = document.getElementById("lat").value;
            const lng = document.getElementById("lng").value;

            if (!name || !desc || !lat || !selectedFile) {
                alert("請確認名稱、簡介、照片與 GPS 定位皆已完成！");
                return;
            }

            // 初始化介面狀態
            document.getElementById("status").innerText = "📸 照片壓縮處理中...";
            document.getElementById("status").style.color = "#FF9800"; // 橘色提示
            document.getElementById("submitBtn").disabled = true;
            document.getElementById("progressContainer").style.display = "none"; // 壓縮時先不顯示進度條

            const reader = new FileReader();
            
            // 讀取照片檔案
            reader.onload = function(event) {
                const originalDataUrl = event.target.result;
                let exifStr = null;

                // 嘗試提取 EXIF 資料 (僅限 JPEG 格式)
                if (selectedFile.type === 'image/jpeg' || selectedFile.type === 'image/jpg') {
                    try {
                        const exifObj = piexif.load(originalDataUrl);
                        if (exifObj["0th"] && exifObj["0th"][piexif.ImageIFD.Orientation]) {
                            exifObj["0th"][piexif.ImageIFD.Orientation] = 1; // 重設旋轉參數
                        }
                        exifStr = piexif.dump(exifObj);
                    } catch (e) {
                        console.warn("讀取 EXIF 失敗或圖片無 EXIF 資料", e);
                    }
                }

                const img = new Image();
                img.src = originalDataUrl;
                
                img.onload = async function() {
                    // 設定最大尺寸 1200px
                    const MAX_WIDTH = 1200;
                    const MAX_HEIGHT = 1200;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                    } else {
                        if (height > MAX_HEIGHT) {
                            width *= MAX_HEIGHT / height;
                            height = MAX_HEIGHT;
                        }
                    }

                    // Canvas 壓縮
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    let compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);

                    // 將暫存的 EXIF 寫回壓縮後的新圖片
                    if (exifStr) {
                        try {
                            compressedDataUrl = piexif.insert(exifStr, compressedDataUrl);
                        } catch (e) {
                            console.warn("寫回 EXIF 失敗", e);
                        }
                    }
                    
                    const base64Data = compressedDataUrl.split(',')[1];
                    
                    const payload = {
                        name: name,
                        desc: desc,
                        lat: lat,
                        lng: lng,
                        image: base64Data,
                        mimeType: 'image/jpeg',
                        filename: 'compressed_' + selectedFile.name.replace(/\.[^/.]+$/, "") + '.jpg'
                    };

                    // 開始準備上傳，顯示進度條
                    document.getElementById("status").innerText = "🚀 正在傳送資料...";
                    document.getElementById("progressContainer").style.display = "block";
                    document.getElementById("progressBar").value = 0;
                    document.getElementById("progressText").innerText = "0%";

                    try {
                        // 使用 Promise 包裝 XMLHttpRequest 以支援進度條
                        const result = await new Promise((resolve, reject) => {
                            const xhr = new XMLHttpRequest();
                            xhr.open("POST", GOOGLE_SCRIPT_URL, true);
                            
                            // 監聽上傳進度 (關鍵部分)
                            xhr.upload.onprogress = function(event) {
                                if (event.lengthComputable) {
                                    const percent = Math.round((event.loaded / event.total) * 100);
                                    document.getElementById("progressBar").value = percent;
                                    
                                    if (percent < 100) {
                                        document.getElementById("progressText").innerText = `上傳中... ${percent}%`;
                                    } else {
                                        document.getElementById("progressText").innerText = `100% (等待 Google 伺服器寫入硬碟中...)`;
                                    }
                                }
                            };

                            // 處理回傳結果
                            xhr.onload = function() {
                                if (xhr.status >= 200 && xhr.status < 300) {
                                    try {
                                        resolve(JSON.parse(xhr.responseText));
                                    } catch (e) {
                                        reject(new Error("解析回傳結果失敗"));
                                    }
                                } else {
                                    reject(new Error("伺服器錯誤狀態碼：" + xhr.status));
                                }
                            };

                            // 處理網路錯誤
                            xhr.onerror = function() {
                                reject(new Error("網路連線失敗"));
                            };

                            // 送出資料
                            xhr.send(JSON.stringify(payload));
                        });
                        
                        // 處理回傳成功
                        if (result.status === "success") {
                            document.getElementById("status").style.color = "green";
                            document.getElementById("status").innerText = "🎉 上傳成功！";
                            document.getElementById("progressContainer").style.display = "none";
                            
                            // 清空表單
                            document.getElementById("name").value = "";
                            document.getElementById("desc").value = "";
                            selectedFile = null;
                            document.getElementById('photoCamera').value = "";
                            document.getElementById('photoGallery').value = "";
                            document.getElementById('fileNameDisplay').innerText = "尚未選擇照片";
                            document.getElementById('fileNameDisplay').style.color = "#555";
                            document.getElementById("coords").innerText = "尚未獲取定位";
                            document.getElementById("lat").value = "";
                            document.getElementById("lng").value = "";
                        } else {
                            document.getElementById("status").style.color = "red";
                            document.getElementById("status").innerText = "雲端硬碟錯誤：" + result.message;
                        }
                    } catch (error) {
                        document.getElementById("status").style.color = "red";
                        document.getElementById("status").innerText = error.message || "網路連線失敗，請稍後再試。";
                    } finally {
                        document.getElementById("submitBtn").disabled = false;
                    }
                };
            };
            
            reader.readAsDataURL(selectedFile);
        }
    </script>
</body>
</html>
